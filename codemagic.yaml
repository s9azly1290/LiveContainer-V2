name: LiveContainer

options:
  minimum_xcode_version: "16.0"

workflows:

  unsigned:
    name: unsigned
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: LiveContainer.xcodeproj
        XCODE_SCHEME: LiveContainer
        BUILD_CONFIG: Release

    scripts:
      - name: Init submodules
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          git submodule sync --recursive
          git submodule update --init --recursive || true
          for d in fishhook litehook OpenSSL; do
            if [ -d "$d" ]; then echo "  $d OK"; else echo "  $d MISSING"; fi
          done

      - name: Ensure OpenSSL xcframework
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          if [ ! -d "OpenSSL/Frameworks/OpenSSL.xcframework" ]; then
            echo "xcframework missing -> fetching from upstream"
            rm -rf /tmp/ossl
            git clone --depth 1 --single-branch \
              https://github.com/krzyzanowskim/OpenSSL.git /tmp/ossl
            mkdir -p OpenSSL/Frameworks
            cp -R /tmp/ossl/Frameworks/OpenSSL.xcframework OpenSSL/Frameworks/
            rm -rf /tmp/ossl
          else
            echo "xcframework present"
          fi

      - name: Re-sign OpenSSL xcframework
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          XCF="OpenSSL/Frameworks/OpenSSL.xcframework"

          # Xcode produces two different errors here:
          #   "is not signed with the expected identity"
          #   "The signature of OpenSSL.xcframework cannot be verified"
          # Both come from signatures baked into the prebuilt slices.
          # Removing a signature without recreating it makes it worse, so
          # delete every artefact first, then rebuild ad-hoc from the
          # inside out: Mach-O binaries first, framework bundles after.

          echo "--- 1. remove signature artefacts ---"
          find "$XCF" -type d -name "_CodeSignature" -prune -exec rm -rf {} + 2>/dev/null || true
          find "$XCF" -type f -name "CodeResources" -delete 2>/dev/null || true
          rm -rf "$XCF/_CodeSignature" 2>/dev/null || true

          echo "--- 1b. strip signing identity from Info.plist ---"
          # Even after re-signing, Xcode rejects the xcframework because the
          # slice Info.plists still advertise the ORIGINAL team. Xcode reads
          # TeamIdentifier/SigningIdentity and compares it to the expected
          # identity, which is how "is not signed with the expected identity"
          # survives a valid re-sign.
          find "$XCF" -name "Info.plist" | while read -r p; do
            for key in TeamIdentifier SigningIdentity SigningAuthority; do
              if /usr/libexec/PlistBuddy -c "Print :$key" "$p" >/dev/null 2>&1; then
                /usr/libexec/PlistBuddy -c "Delete :$key" "$p" >/dev/null 2>&1                   && echo "  removed $key from $p"
              fi
            done
          done

          echo "--- 2. ad-hoc sign Mach-O binaries ---"
          find "$XCF" -type f ! -name "*.plist" ! -name "*.txt" ! -name "*.json" \
            | while read -r f; do
              if file "$f" 2>/dev/null | grep -q "Mach-O"; then
                if codesign --force --sign - --timestamp=none "$f" >/dev/null 2>&1; then
                  echo "  ok   $(basename "$f")"
                else
                  echo "  FAIL $(basename "$f")"
                fi
              fi
            done

          echo "--- 3. ad-hoc sign framework bundles ---"
          find "$XCF" -type d -name "*.framework" | while read -r fw; do
            if codesign --force --sign - --timestamp=none "$fw" >/dev/null 2>&1; then
              echo "  ok   $(basename "$fw")"
            else
              echo "  FAIL $fw"
            fi
          done

          echo "--- 4. ad-hoc sign the xcframework bundle itself ---"
          # Xcode reports the error as "<xcframework>:1:1", which means it
          # validates the xcframework bundle itself, not only its slices.
          if codesign --force --sign - --timestamp=none "$XCF" >/dev/null 2>&1; then
            echo "  ok   $XCF"
          else
            echo "  FAIL $XCF -- retrying with --deep"
            if codesign --force --deep --sign - --timestamp=none "$XCF" >/dev/null 2>&1; then
              echo "  ok   (deep)"
            else
              echo "  FAIL (deep)"
            fi
          fi

          echo "--- 5. verify ---"
          if codesign -v "$XCF" >/dev/null 2>&1; then
            echo "  xcframework : valid"
          else
            echo "  xcframework : INVALID"
          fi
          for fw in "$XCF"/*/OpenSSL.framework; do
            if [ -d "$fw" ]; then
              if codesign -v "$fw" >/dev/null 2>&1; then
                echo "  valid:   $(basename "$(dirname "$fw")")"
              else
                echo "  INVALID: $(basename "$(dirname "$fw")")"
              fi
            fi
          done

      - name: Build (signing disabled)
        script: |
          set -o pipefail
          cd "$CM_BUILD_DIR"
          # CODE_SIGNING_ALLOWED=NO makes Xcode skip embedded-binary
          # validation entirely. This has never actually been exercised
          # with a present xcframework: the earlier attempt failed earlier
          # (submodule missing), and ad-hoc signing still failed with
          #   'OpenSSL.xcframework' is not signed with the expected identity
          # because validation compares against an Apple identity we do not
          # have. The resulting .app is unsigned on purpose; 'Strip
          # signature' cleans up afterwards.
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$BUILD_CONFIG" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$CM_BUILD_DIR/build.log" \
              | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | head -60

      - name: Strip signature
        script: |
          set -e
          APP=$(find "$CM_BUILD_DIR/derived_data/Build/Products" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: no .app produced"
            grep -iE "error:" "$CM_BUILD_DIR/build.log" | head -30 || true
            exit 1
          fi
          echo "built: $APP"
          rm -rf "$APP/_CodeSignature" 2>/dev/null || true
          du -sh "$APP"

    artifacts:
      - $CM_BUILD_DIR/derived_data/Build/Products/**/*.app
      - $CM_BUILD_DIR/build.log

  adhoc:
    name: adhoc
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: LiveContainer.xcodeproj
        XCODE_SCHEME: LiveContainer
        BUNDLE_ID: com.kdt.livecontainer
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.kdt.livecontainer

    scripts:
      - name: Init submodules
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up provisioning profiles
        script: xcode-project use-profiles

      - name: Build ipa
        script: |
          set -o pipefail
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log