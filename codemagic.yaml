name: LiveContainer

options:
  minimum_xcode_version: "16.0"

workflows:

  # ══════════════════════════════════════════════════════════════════════════
  #  unsigned — ابدأ هنا. مش محتاج أي شهادة.
  # ══════════════════════════════════════════════════════════════════════════
  unsigned:
    name: unsigned
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: LiveContainer.xcodeproj
        XCODE_SCHEME: LiveContainer
        BUILD_CONFIG: Release

    scripts:
      - name: Init submodules
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          git submodule sync --recursive
          git submodule update --init --recursive || true
          echo "--- submodules ---"
          for d in fishhook litehook OpenSSL; do
            if [ -d "$d" ]; then echo "  $d OK"; else echo "  $d MISSING"; fi
          done

      - name: Ensure OpenSSL xcframework
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          # Fallback: if the submodule did not provide the
          # xcframework, fetch just that slice from upstream.
          if [ ! -d "OpenSSL/Frameworks/OpenSSL.xcframework" ]; then
            echo "xcframework missing -> fetching from upstream"
            rm -rf /tmp/ossl
            git clone --depth 1 --single-branch \
              https://github.com/krzyzanowskim/OpenSSL.git /tmp/ossl
            mkdir -p OpenSSL/Frameworks
            cp -R /tmp/ossl/Frameworks/OpenSSL.xcframework OpenSSL/Frameworks/
            rm -rf /tmp/ossl
            echo "xcframework restored"
          else
            echo "xcframework present"
          fi
          ls OpenSSL/Frameworks/

      - name: Build (unsigned)
        script: |
          set -o pipefail
          cd "$CM_BUILD_DIR"
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$BUILD_CONFIG" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee "$CM_BUILD_DIR/build.log" | grep -E "error:|warning: .*(deprecat|unused)|BUILD" | head -60

      - name: Strip signature
        script: |
          set -e
          APP=$(find "$CM_BUILD_DIR/derived_data/Build/Products" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: no .app produced"
            echo "--- last errors ---"
            grep -iE "error:" "$CM_BUILD_DIR/build.log" | head -30 || true
            exit 1
          fi
          echo "built: $APP"
          rm -rf "$APP/_CodeSignature" 2>/dev/null || true
          du -sh "$APP"

    artifacts:
      - $CM_BUILD_DIR/derived_data/Build/Products/**/*.app
      - $CM_BUILD_DIR/build.log

  # ══════════════════════════════════════════════════════════════════════════
  #  adhoc — موقّع. محتاج ترفع p12 + profile في Codemagic UI.
  # ══════════════════════════════════════════════════════════════════════════
  adhoc:
    name: adhoc
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: LiveContainer.xcodeproj
        XCODE_SCHEME: LiveContainer
        BUNDLE_ID: com.kdt.livecontainer
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.kdt.livecontainer

    scripts:
      - name: Init submodules
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up provisioning profiles
        script: xcode-project use-profiles

      - name: Build ipa
        script: |
          set -o pipefail
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log